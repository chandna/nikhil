<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hero Directions — Side by Side</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; background: #e9e6df; }
  .frame-shell { width: 1280px; height: 760px; background: #000; overflow: hidden; }
  .frame-shell iframe { width: 1280px; height: 760px; border: 0; display: block; }
  .note { font-family: "JetBrains Mono", monospace; font-size: 12px; line-height: 1.6; color: #46443d; letter-spacing: 0.02em; }
  .note b { color: #0e0e0c; font-weight: 500; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>

  <script type="text/babel">
    const SRC = encodeURIComponent('Nikhil Chandna — Portfolio.html');
    function Frame({ hero }) {
      const src = 'Portfolio.html?hero=' + hero + '&bare=1';
      return (
        <div className="frame-shell">
          <iframe src={src} loading="eager" title={`Hero ${hero}`}></iframe>
        </div>
      );
    }
    function App() {
      return (
        <DesignCanvas>
          <DCSection id="heroes" title="Hero / Landing — two directions" subtitle="Same monochrome system · pick one and I'll wire it as the default">
            <DCArtboard id="a" label="A · Editorial Masthead" width={1280} height={760}>
              <Frame hero="a" />
            </DCArtboard>
            <DCArtboard id="b" label="B · Engineer / Terminal" width={1280} height={760}>
              <Frame hero="b" />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
